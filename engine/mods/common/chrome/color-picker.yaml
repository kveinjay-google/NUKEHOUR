Background@COLOR_CHOOSER:
	Logic: ColorPickerLogic, IosTouchColorPickerLogic
		PaletteColumns: 8
		PalettePresetRows: 2
		PaletteCustomRows: 1
	Background: dialog2
	Width: 326
	Height: 154
	Children:
		Button@RANDOM_BUTTON:
			Key: tab
			X: 245
			Y: 95
			Width: 76
			Height: 25
			Text: button-color-chooser-random
			Font: Bold
		Button@STORE_BUTTON:
			X: 245
			Y: 124
			Width: 76
			Height: 25
			Text: button-color-chooser-store
			Font: Bold
		ActorPreview@PREVIEW:
			X: 245
			Y: 13
			Width: 76
			Height: 73
		Button@MIXER_TAB_BUTTON:
			X: 5
			Y: PARENT_HEIGHT - 30
			Height: 25
			Width: 80
			Text: button-color-chooser-mixer-tab
			Font: Bold
		Button@PALETTE_TAB_BUTTON:
			X: 85
			Y: PARENT_HEIGHT - 30
			Height: 25
			Width: 80
			Text: button-color-chooser-palette-tab
			Font: Bold
		Container@MIXER_TAB:
			X: 5
			Y: 5
			Width: PARENT_WIDTH - 90
			Height: PARENT_HEIGHT - 34
			Children:
				Background@HUEBG:
					Background: dialog3
					X: 0
					Y: 0
					Width: PARENT_WIDTH
					Height: 17
					Children:
						HueSlider@HUE_SLIDER:
							X: 2
							Y: 2
							Width: PARENT_WIDTH - 4
							Height: PARENT_HEIGHT - 4
							Ticks: 5
				Background@MIXERBG:
					Background: dialog3
					X: 0
					Y: 22
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT - 22
					Children:
						ColorMixer@MIXER:
							X: 2
							Y: 2
							Width: PARENT_WIDTH - 4
							Height: PARENT_HEIGHT - 4
		Background@PALETTE_TAB:
			Background: dialog3
			X: 5
			Y: 5
			Width: PARENT_WIDTH - 90
			Height: PARENT_HEIGHT - 34
			Visible: false
			Children:
				Container@PALETTE_TAB_PANEL:
					X: 0
					Y: 0
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					Children:
						Background@PRESET_HEADER:
							Background: dialog2
							Width: PARENT_WIDTH - 4
							Height: 13
							X: 2
							Y: 2
							Children:
								Label@LABEL:
									Font: TinyBold
									Width: PARENT_WIDTH
									Height: 13
									Align: Center
									Text: label-preset-header
						Container@PRESET_AREA:
							Width: PARENT_WIDTH - 4
							Height: 58
							X: 2
							Y: 16
							Children:
								ColorBlock@COLORPRESET:
									X: 0
									Y: 0
									Width: 29
									Height: 29
									Visible: false
									ClickSound: ClickSound
						Background@CUSTOM_HEADER:
							Background: dialog2
							Width: PARENT_WIDTH - 4
							Height: 13
							X: 2
							Y: 75
							Children:
								Label@LABEL:
									Font: TinyBold
									Width: PARENT_WIDTH
									Height: 13
									Align: Center
									Text: label-custom-header
						Container@CUSTOM_AREA:
							Width: PARENT_WIDTH - 4
							Height: 31
							X: 2
							Y: 89
							Children:
								ColorBlock@COLORCUSTOM:
									X: 0
									Y: 0
									Width: 29
									Height: 29
									Visible: false
									ClickSound: ClickSound

