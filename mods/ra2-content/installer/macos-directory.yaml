macos-directory: Red Alert 2 Local Installation
	Type: MacOSDirectory
	RequiredFiles: ra2.mix, language.mix
	Install:
		ContentPackage@base:
			Name: base
			Actions:
				Copy: .
					^SupportDir|Content/ra2/ra2.mix: ra2.mix
					^SupportDir|Content/ra2/language.mix: language.mix
		ContentPackage@music:
			Name: music
			Actions:
				Copy: .
					^SupportDir|Content/ra2/theme.mix: theme.mix
		ContentPackage@yuri:
			Name: yuri
			Actions:
				Copy: .
					^SupportDir|Content/ra2/ra2md.mix: ra2md.mix
					^SupportDir|Content/ra2/langmd.mix: langmd.mix
		ContentPackage@yuri-music:
			Name: yuri-music
			Actions:
				Copy: .
					^SupportDir|Content/ra2/thememd.mix: thememd.mix
