			X: 295
			Y: 218
			Width: 235
			Height: 30
			VAlign: Middle
			Font: Regular
		Label@WEBSITE_CAPTION:
			X: 90
			Y: 260
			Width: 190
			Height: 30
			Align: Right
			VAlign: Middle
			Font: MediumBold
			Text: label-nuke-hour-about-website
		Label@WEBSITE_URL:
			X: 295
			Y: 260
			Width: 235
			Height: 30
			VAlign: Middle
			Font: Regular
			Text: label-nuke-hour-about-url
		Button@BACK_BUTTON:
			X: (PARENT_WIDTH - WIDTH) / 2
			Y: 332
			Width: 220
			Height: 54
			Font: BigBold
			Text: button-back
			Key: escape
