			Y: 30
			Width: PARENT_WIDTH - 80
			Height: 48
			Align: Center
			VAlign: Middle
			Font: BigBold
			Text: label-nuke-hour-about-title
		Label@ABOUT_DESCRIPTION:
			X: 55
			Y: 102
			Width: PARENT_WIDTH - 110
			Height: 88
			Align: Center
			VAlign: Middle
			Font: Regular
			WordWrap: true
