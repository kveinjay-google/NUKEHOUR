slav:
	Inherits: ^Infantry
	# Never appear in the barracks queue — only spawned by the Slave Miner.
	Valued:
		Cost: 0
	Tooltip:
		Name: actor-slav.name
	Selectable:
		Priority: 7
		Bounds: 482, 1448, 0, -530
	Health:
		HP: 100
	Mobile:
		Speed: 60
	Harvester:
		Type: SlaveUnload
		Resources: Ore, Gems
		BaleLoadDelay: 4
		BaleUnloadDelay: 1
		FullyLoadedSpeed: 100
		SearchFromProcRadius: 24
		SearchFromHarvesterRadius: 12
		SearchOnCreation: true
		HarvestVoice: Harvest
		EmptyCondition: no-ore
	StoresResources:
		Capacity: 5
		Resources: Ore, Gems
	DockClientManager:
		Voice: Move
	SlaveMinerWorker:
	RevealsShroud:
		Range: 4c0
	WithInfantryBody:
		IdleSequences: idle1, idle2
		StandSequences: stand
		MoveSequence: run
		DefaultAttackSequence: shoot
		RequiresCondition: no-ore
	WithInfantryBody@full:
		IdleSequences: idle1, idle2
		StandSequences: stand
		MoveSequence: full-run
		DefaultAttackSequence: shoot
		RequiresCondition: !no-ore
	Armament:
		Weapon: Shovel
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 2
	WithStoresResourcesPipsDecoration:
		Position: BottomLeft
		RequiresSelection: true
		PipCount: 5
		Palette: pips
		ResourceSequences:
			Ore: pip-yellow
			Gems: pip-red
	RenderSprites:
		Image: slav
	Voiced:
		VoiceSet: SlaveVoice
	QuantizeFacingsFromSequence:
		Sequence: stand
	-Passenger:
	-TakeCover:
