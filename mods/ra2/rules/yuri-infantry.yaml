init:
	Inherits@1: ^Infantry
	Inherits@2: ^Parachutable
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@MC: ^MindControllable
	Buildable:
		Queue: Infantry
		Prerequisites: ~infantry.yuri
		BuildPaletteOrder: 10
		Description: actor-init.description
	Valued:
		Cost: 200
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Tooltip:
		Name: actor-init.name
	Selectable:
		Bounds: 482, 1448, 0, -530
	Health:
		HP: 125
	Mobile:
		Speed: 56
	Garrisoner:
		Voice: Move
		CustomPipType: red
		GarrisonType: Garrisoner
	Passenger:
		CustomPipType: red
	RevealsShroud:
		Range: 5c0
	Armament:
		Weapon: PsychicJab
		RequiresCondition: !rank-elite
	Armament@elite:
		Weapon: PsychicJabE
		RequiresCondition: rank-elite
	Armament@opentopped:
		Weapon: PsychicJab
		Name: opentopped
		RequiresCondition: !rank-elite
	Armament@elite-opentopped:
		Weapon: PsychicJabE
		Name: opentopped
		RequiresCondition: rank-elite
	AttackFrontal:
		Voice: Attack
		FacingTolerance: 0
	WithInfantryBody:
		DefaultAttackSequence: shoot
	RenderSprites:
		Image: init
	Voiced:
		VoiceSet: InitiateVoice
	QuantizeFacingsFromSequence:
		Sequence: stand

