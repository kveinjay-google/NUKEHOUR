PackageFormats: Mix, AudioBag
FileSystem: ContentInstallerFileSystem
	SystemPackages:
		^EngineDir
		$ra2: ra2
		$ts: ts
		^EngineDir|mods/common: common
		~^SupportDir|Content/ra2: content
	ContentInstallerMod: ra2-content
	ContentPackages:
		# Yuri's Revenge (optional - mounted only when the player provides YR assets).
		# Mounted before the RA2 packages so original RA2 artwork wins for shared files.
		~langmd.mix: langmd
		~ra2md.mix: ra2md
		~thememd.mix
		~langmd|audiomd.mix: audiomd
		~langmd|cameomd.mix: cameomd
		~ra2md|cachemd.mix
		~ra2md|conqmd.mix: conqmd
		~ra2md|des.mix
		~ra2md|desert.mix
		~ra2md|genermd.mix
		~ra2md|isodesmd.mix
		~ra2md|isodes.mix
		~ra2md|isogenmd.mix
		~ra2md|isolunmd.mix
		~ra2md|isolun.mix
		~ra2md|isosnomd.mix
		~ra2md|isotemmd.mix
		~ra2md|isoubnmd.mix
		~ra2md|isoubn.mix
		~ra2md|isourbmd.mix
		~ra2md|loadmd.mix
		~ra2md|localmd.mix: localmd
		~ra2md|lun.mix
		~ra2md|lunar.mix
		~ra2md|ntrlmd.mix
		~ra2md|snowmd.mix
		~ra2md|ubn.mix
		~ra2md|urbann.mix
		~audiomd|audio.bag

		# Red Alert 2
		ra2.mix
		language.mix
		audio.mix
		cache.mix
		cameo.mix
		conquer.mix: conquer
		generic.mix
		isogen.mix
		isosnow.mix
		isotemp.mix
		isourb.mix
		load.mix
		local.mix
		neutral.mix
		sidec01.mix
		sidec02.mix
		sno.mix
		snow.mix
		tem.mix
		temperat.mix
		urb.mix
		urban.mix
		audio.bag
		~theme.mix
		# Below are mod-provided (system) packages that need to be loaded after the content packages so they can override content assets.
		ra2|bits
		ra2|bits/cameos
		ra2|bits/structures
		ra2|bits/animations
		ra2|bits/projectiles
		ra2|uibits
MapFolders:
	ra2|maps: System
	^SupportDir|Content/ra2/maps: User
	~^SupportDir|maps/ra2/{DEV_VERSION}: User
